<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ErmaJean - Offline</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background-color: #f7f7ed;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .offline-icon {
        width: 80px;
        height: 80px;
        background-color: #4a7c59;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: white;
        font-size: 36px;
        font-weight: bold;
      }
      h1 {
        color: #4a7c59;
        margin-bottom: 10px;
      }
      p {
        max-width: 400px;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .retry-btn {
        background-color: #4a7c59;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }
      .retry-btn:hover {
        background-color: #3d6b4a;
      }
    </style>
  </head>
  <body>
    <div class="offline-icon">EJ</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you're not connected to the internet. Some features may not
      be available until you reconnect.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
  </body>
</html>
